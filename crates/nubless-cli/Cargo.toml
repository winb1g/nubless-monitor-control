[package]
name = "nubless-cli"
description = "Command-line control for the LG 27GM950B without touching the OSD joystick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nubless"
path = "src/main.rs"

[dependencies]
nubless-core.workspace = true
nubless-hw.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
